<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Project Wizard</title>
    <link rel="stylesheet" href="styles.css"/>
</head>

<body>

<div class="container">

    <h1>Project Wizard</h1>

    <div id="stepIndicator">Step 1 / 5</div>

    <!-- STEP 1 -->
    <div class="step" id="step-1">
        <h2>Project Info</h2>

        <input id="name" placeholder="Project name"/>
        <input type="date" id="startDate"/>
        <input type="date" id="endDate"/>
        <input type="number" id="priority" placeholder="Priority (1-10)" min="1" max="10"/>

        <button onclick="nextStep()">Next</button>
    </div>

    <!-- STEP 2 -->
    <div class="step hidden" id="step-2">
        <h2>Companies</h2>

        <input id="customerCompany" placeholder="Customer company"/>
        <input id="workerCompany" placeholder="Worker company"/>

        <button onclick="prevStep()">Back</button>
        <button onclick="nextStep()">Next</button>
    </div>

    <!-- STEP 3 -->
    <div class="step hidden" id="step-3">
        <h2>Manager</h2>

        <select id="managerSelect"></select>

        <button onclick="prevStep()">Back</button>
        <button onclick="nextStep()">Next</button>
    </div>

    <!-- STEP 4 -->
    <div class="step hidden" id="step-4">
        <h2>Employees</h2>

        <div id="employeesList"></div>

        <button onclick="prevStep()">Back</button>
        <button onclick="nextStep()">Next</button>
    </div>

    <!-- STEP 5 -->
    <div class="step hidden" id="step-5">
        <h2>Finish</h2>

        <input type="file" multiple/>

        <button onclick="prevStep()">Back</button>
        <button onclick="submit()">Create Project</button>
    </div>

</div>

<script src="app.js"></script>

</body>
</html>
